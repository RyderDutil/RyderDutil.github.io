<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<title>Ryder Dutil — Engineering Portfolio</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --cream: #f7f8fc;
  --white: #ffffff;
  --blue-50: #eef3fb;
  --blue-100: #d6e4f7;
  --blue-200: #b0caf0;
  --blue-400: #5e96d8;
  --blue-600: #2d6db4;
  --blue-800: #1a3f6e;
  --blue-900: #0f2444;
  --ink: #111827;
  --ink-2: #374151;
  --ink-3: #6b7280;
  --ink-4: #9ca3af;
  --rule: #dde5f0;
  --rule-light: #eef2f9;
}

html { scroll-behavior: smooth; }

body {
  background: var(--cream);
  color: var(--ink);
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  font-weight: 300;
  line-height: 1.6;
}

nav {
  position: sticky;
  top: 0;
  z-index: 200;
  background: rgba(247,248,252,0.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--rule);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 3rem;
  height: 60px;
}
.nav-logo {
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  font-size: 13px;
  font-weight: 500;
  color: var(--blue-600);
  text-decoration: none;
  letter-spacing: 0.05em;
}
.nav-links { display: flex; gap: 2rem; list-style: none; }
.nav-links a {
  font-size: 13px;
  color: var(--ink-3);
  text-decoration: none;
  transition: color 0.2s;
}
.nav-links a:hover { color: var(--blue-600); }

.hero {
  background: linear-gradient(160deg, var(--blue-50) 0%, var(--cream) 60%);
  border-bottom: 1px solid var(--rule);
  padding: 5rem 3rem 4rem;
}
.hero-inner {
  max-width: 1100px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 1.2fr 1fr;
  gap: 4rem;
  align-items: center;
}
.hero-eyebrow {
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  font-size: 11px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--blue-400);
  margin-bottom: 1.25rem;
  display: flex;
  align-items: center;
  gap: 0.75rem;
}
.hero-eyebrow::before {
  content: '';
  display: inline-block;
  width: 24px;
  height: 1px;
  background: var(--blue-400);
}
.hero-title {
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  font-size: clamp(2.8rem, 5vw, 4.2rem);
  font-weight: 300;
  line-height: 1.1;
  color: var(--ink);
  margin-bottom: 0.25rem;
}
.hero-title .accent { color: var(--blue-600); font-style: italic; }
.hero-subtitle {
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  font-size: clamp(1.1rem, 2vw, 1.4rem);
  font-style: italic;
  color: var(--ink-3);
  margin-bottom: 2rem;
}
.hero-chips { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.chip {
  background: var(--blue-100);
  color: var(--blue-800);
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  font-size: 11px;
  padding: 5px 12px;
  border-radius: 20px;
  letter-spacing: 0.04em;
}
.hero-desc {
  font-size: 15px;
  color: var(--ink-2);
  line-height: 1.8;
  margin-bottom: 2rem;
}
.hero-meta { display: flex; flex-direction: column; gap: 0.4rem; }
.meta-row {
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  font-size: 11px;
  color: var(--ink-4);
  display: flex;
  gap: 0.75rem;
}
.meta-row span.v { color: var(--ink-2); }

.section-wrap { max-width: 1100px; margin: 0 auto; padding: 4rem 3rem; }
.section-header { display: flex; align-items: baseline; gap: 1rem; margin-bottom: 1rem; }
.section-title { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 1.8rem; font-weight: 400; color: var(--ink); }
.section-rule { height: 1px; background: var(--rule); margin-bottom: 2.5rem; }

.projects-stack { display: flex; flex-direction: column; gap: 2.5rem; }

.project-card {
  background: var(--white);
  border: 1px solid var(--rule);
  border-radius: 12px;
  overflow: hidden;
  display: grid;
  grid-template-columns: 1.1fr 1fr;
  transition: box-shadow 0.2s;
}
.project-card:hover { box-shadow: 0 4px 24px rgba(45,109,180,0.09); }

.gallery-panel {
  background: var(--blue-50);
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--rule);
}
.gallery-main {
  flex: 1;
  min-height: 300px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}
.gallery-main img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: opacity 0.2s;
}
.placeholder {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0.75rem;
  width: 100%;
  min-height: 280px;
  padding: 2rem;
}
.placeholder svg { opacity: 0.18; }
.placeholder-text {
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  font-size: 11px;
  color: var(--ink-4);
  text-align: center;
  line-height: 1.8;
}
.gallery-thumbs {
  display: flex;
  gap: 6px;
  padding: 10px;
  border-top: 1px solid var(--rule);
  background: var(--white);
  overflow-x: auto;
  min-height: 60px;
}
.thumb {
  width: 52px;
  height: 40px;
  border-radius: 5px;
  border: 2px solid transparent;
  overflow: hidden;
  cursor: pointer;
  flex-shrink: 0;
  background: var(--blue-50);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: border-color 0.15s;
}
.thumb.active { border-color: var(--blue-400); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb-placeholder {
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  font-size: 8px;
  color: var(--ink-4);
  text-align: center;
  padding: 2px;
  line-height: 1.3;
}

.project-info {
  padding: 2rem 2.25rem;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 1.5rem;
}
.project-name {
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  font-size: 1.5rem;
  font-weight: 400;
  color: var(--ink);
  line-height: 1.2;
  margin-bottom: 0.75rem;
}
.project-desc { font-size: 13.5px; color: var(--ink-2); line-height: 1.75; }
.project-specs {
  border-top: 1px solid var(--rule-light);
  border-bottom: 1px solid var(--rule-light);
  padding: 0.9rem 0;
  display: flex;
  flex-direction: column;
  gap: 0.45rem;
}
.spec-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 1rem;
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  font-size: 11px;
}
.spec-key { color: var(--ink-4); }
.spec-val { color: var(--ink-2); text-align: right; }
.project-footer { display: flex; flex-direction: column; gap: 0.75rem; align-items: center; text-align: center; }
.tags { display: flex; flex-wrap: wrap; gap: 0.35rem; justify-content: center; }
.tag {
  background: var(--blue-50);
  color: var(--blue-800);
  border: 1px solid var(--blue-100);
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  font-size: 10px;
  padding: 3px 10px;
  border-radius: 20px;
}
.btn-download {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  background: var(--blue-600);
  color: #fff;
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  font-size: 11px;
  letter-spacing: 0.06em;
  padding: 9px 16px;
  border-radius: 6px;
  text-decoration: none;
  transition: background 0.2s;
  width: fit-content;
}
.btn-download:hover { background: var(--blue-800); }
.btn-download svg { width: 14px; height: 14px; flex-shrink: 0; }

.skills-section {
  background: var(--white);
  border-top: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
}
.skills-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 1px;
  background: var(--rule);
  border: 1px solid var(--rule);
  border-radius: 10px;
  overflow: hidden;
}
.skill-card { background: var(--white); padding: 1.5rem; }
.skill-card-label {
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--blue-400);
  margin-bottom: 1rem;
}
.skill-list { list-style: none; display: flex; flex-direction: column; gap: 0.5rem; }
.skill-list li {
  font-size: 13.5px;
  color: var(--ink-2);
  display: flex;
  align-items: center;
  gap: 0.6rem;
}
.skill-list li::before {
  content: '';
  width: 5px;
  height: 5px;
  background: var(--blue-200);
  border-radius: 50%;
  flex-shrink: 0;
}

.about-grid {
  display: grid;
  grid-template-columns: 1fr 2fr;
  gap: 4rem;
  align-items: start;
}
.stat-block { margin-bottom: 2rem; }
.stat-num {
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  font-size: 3rem;
  font-weight: 300;
  color: var(--blue-600);
  line-height: 1;
}
.stat-label {
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--ink-4);
  margin-top: 0.25rem;
}
.about-text { font-size: 15px; color: var(--ink-2); line-height: 1.85; }
.about-text p + p { margin-top: 1rem; }

footer {
  background: var(--blue-900);
  padding: 4rem 3rem;
  text-align: center;
}
.footer-title {
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  font-size: 2rem;
  font-style: italic;
  color: var(--blue-100);
  margin-bottom: 0.5rem;
}
.footer-sub {
  font-size: 13px;
  color: var(--blue-200);
  margin-bottom: 2rem;
  opacity: 0.7;
}
.footer-links { display: flex; justify-content: center; gap: 2rem; flex-wrap: wrap; }
.footer-links a {
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  font-size: 12px;
  color: var(--blue-200);
  text-decoration: none;
  letter-spacing: 0.06em;
  opacity: 0.75;
  transition: opacity 0.2s;
}
.footer-links a:hover { opacity: 1; }
.footer-copy {
  margin-top: 2.5rem;
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  font-size: 10px;
  color: var(--blue-200);
  opacity: 0.3;
  letter-spacing: 0.06em;
}

@media (max-width: 800px) {
  nav { padding: 0 1.5rem; }
  .hero { padding: 3rem 1.5rem; }
  .hero-inner { grid-template-columns: 1fr; gap: 2rem; }
  .section-wrap { padding: 3rem 1.5rem; }
  .project-card { grid-template-columns: 1fr; }
  .gallery-panel { border-right: none; border-bottom: 1px solid var(--rule); }
  .about-grid { grid-template-columns: 1fr; gap: 2rem; }
  footer { padding: 3rem 1.5rem; }
  .footer-links { flex-direction: column; gap: 1rem; align-items: center; }
}
</style>
</head>
<body>

<nav>
  <a href="#" class="nav-logo">RD // PORTFOLIO</a>
  <ul class="nav-links">
    <li><a href="#projects">Projects</a></li>
    <li><a href="#skills">Skills</a></li>
    <li><a href="#about">About</a></li>
